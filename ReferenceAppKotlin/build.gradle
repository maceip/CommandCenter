plugins {
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.0.21" apply false
    id "org.jetbrains.kotlin.plugin.parcelize" version "2.0.21" apply false
    id "org.jetbrains.kotlin.kapt" version "2.0.21" apply false
    id "androidx.navigation.safeargs.kotlin" version "2.7.7" apply false
    id "com.diffplug.spotless" version "6.25.0" apply false
}

subprojects {
    apply plugin: "com.diffplug.spotless"
    ext.ktlintVer = "0.50.0"
    spotless {
        kotlin {
            target("**/*.kt")
            ktlint(ktlintVer).editorConfigOverride([
                "max_line_length": "100",
            ])
            licenseHeaderFile(rootProject.file("copyright.kt"))
        }
    }

    tasks.configureEach { task ->
        if (task.name == "preBuild") {
            task.mustRunAfter("spotlessCheck")
        }
    }
}
